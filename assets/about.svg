<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 310" width="860" height="310" role="img" aria-label="Terminal: whoami — Mael Compagnon, fourth-year engineering student at ESAIP, robotic cell operator at SalMar in Norway, president of ANT, freelance web developer. Looking for a 6-month internship in 2027, anywhere international.">
  <style>
    .m    { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .user { fill: #2dd4bf; }
    .dir  { fill: #58a6ff; }
    .pct  { fill: #8b949e; }
    .cmd  { fill: #e6edf3; }
    .out  { fill: #adbac7; }
    .dim  { fill: #768390; }
    .hl   { fill: #2dd4bf; font-weight: 600; }
    .tt   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 11px; fill: #6e7681; }
    .cur  { fill: #2dd4bf; }
  </style>

  <rect x="0.5" y="0.5" width="859" height="309" rx="8" fill="#0d1117" stroke="#30363d" />
  <path d="M0.5 8.5a8 8 0 0 1 8-8h843a8 8 0 0 1 8 8V34H0.5z" fill="#161b22" stroke="#30363d" />
  <circle cx="24" cy="17" r="5.5" fill="#ec6a5e" />
  <circle cx="44" cy="17" r="5.5" fill="#f4bf4f" />
  <circle cx="64" cy="17" r="5.5" fill="#61c554" />
  <text class="tt" x="430" y="21" text-anchor="middle">maelcompagnon — zsh</text>

  <defs>
    <clipPath id="k1"><rect x="138" y="52" width="0" height="20">
      <animate attributeName="width" from="0" to="56" begin="0.4s" dur="0.9s" fill="freeze" />
    </rect></clipPath>
    <clipPath id="k2"><rect x="138" y="180" width="0" height="20">
      <animate attributeName="width" from="0" to="160" begin="2.7s" dur="1.2s" fill="freeze" />
    </rect></clipPath>
  </defs>

  <text class="m" x="24" y="66"><tspan class="user">mael@esaip</tspan><tspan class="pct">:</tspan><tspan class="dir">~</tspan><tspan class="pct">$</tspan></text>
  <g clip-path="url(#k1)"><text class="m cmd" x="138" y="66">whoami</text></g>

  <rect class="cur" x="138" y="54" width="8" height="15" opacity="0">
    <animate attributeName="opacity" begin="0.4s" dur="0.9s" fill="freeze" values="1;1" />
    <animate attributeName="x" from="138" to="194" begin="0.4s" dur="0.9s" fill="freeze" />
    <animate attributeName="opacity" from="1" to="0" begin="1.5s" dur="0.2s" fill="freeze" />
  </rect>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.7s" dur="0.4s" fill="freeze" />
    <text class="m out" x="24" y="94">Maël Compagnon — fourth-year engineering student at ESAIP, AI</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.85s" dur="0.4s" fill="freeze" />
    <text class="m out" x="24" y="116">Currently in Norway — robotic cell operator at SalMar, 22 people</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.4s" fill="freeze" />
    <text class="m out" x="24" y="138">President of ANT — digital literacy for seniors, since 2024</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.15s" dur="0.4s" fill="freeze" />
    <text class="m dim" x="24" y="160">Freelance web developer on the side</text></g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.6s" dur="0.2s" fill="freeze" />
    <text class="m" x="24" y="194"><tspan class="user">mael@esaip</tspan><tspan class="pct">:</tspan><tspan class="dir">~</tspan><tspan class="pct">$</tspan></text></g>
  <g clip-path="url(#k2)"><text class="m cmd" x="138" y="194">cat internship.txt</text></g>

  <rect class="cur" x="138" y="182" width="8" height="15" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.7s" dur="0.01s" fill="freeze" />
    <animate attributeName="x" from="138" to="298" begin="2.7s" dur="1.2s" fill="freeze" />
    <animate attributeName="opacity" from="1" to="0" begin="4.1s" dur="0.2s" fill="freeze" />
  </rect>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.3s" dur="0.4s" fill="freeze" />
    <text class="m hl" x="24" y="222">Looking for a 6-month internship — 2027</text></g>
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.45s" dur="0.4s" fill="freeze" />
    <text class="m out" x="24" y="244">Anywhere international.</text></g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="4.9s" dur="0.3s" fill="freeze" />
    <text class="m" x="24" y="278"><tspan class="user">mael@esaip</tspan><tspan class="pct">:</tspan><tspan class="dir">~</tspan><tspan class="pct">$</tspan></text>
  </g>
  <rect class="cur" x="138" y="266" width="8" height="15" opacity="0">
    <animate attributeName="opacity" begin="5.1s" dur="1.1s" repeatCount="indefinite"
      values="1;1;0;0" keyTimes="0;0.5;0.5;1" />
  </rect>
</svg>
