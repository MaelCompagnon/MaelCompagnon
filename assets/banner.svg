<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 206" width="860" height="206" role="img" aria-label="Mael Compagnon — AI and robotics engineering student at ESAIP, Angers, France. Will relocate anywhere with interesting robots.">
  <style>
    .m    { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .tt   { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: #6e7681; }
    .user { fill: #2dd4bf; }
    .dir  { fill: #58a6ff; }
    .pct  { fill: #8b949e; }
    .cmd  { fill: #e6edf3; }
    .out  { fill: #adbac7; }
    .dim  { fill: #768390; }
    .hl   { fill: #2dd4bf; }
    .cur  { fill: #2dd4bf; }
    .name { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 34px; font-weight: 700; fill: #e6edf3; letter-spacing: 3px; }
    .sub  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #768390; letter-spacing: 0.5px; }
  </style>
  <rect x="0.5" y="0.5" width="859" height="205" rx="8" fill="#0d1117" stroke="#30363d" />
  <path d="M0.5 8.5a8 8 0 0 1 8-8h843a8 8 0 0 1 8 8V34H0.5z" fill="#161b22" stroke="#30363d" />
  <circle cx="24" cy="17" r="5.5" fill="#ec6a5e" />
  <circle cx="44" cy="17" r="5.5" fill="#f4bf4f" />
  <circle cx="64" cy="17" r="5.5" fill="#61c554" />
  <text class="tt" x="430.0" y="21" text-anchor="middle">maelcompagnon — zsh</text>

  <defs>
    <clipPath id="k0"><rect x="138" y="48" width="0" height="20">
      <animate attributeName="width" from="0" to="87" begin="0.4s" dur="0.8s" fill="freeze" />
    </rect></clipPath>
    <clipPath id="k1"><rect x="48" y="158" width="0" height="22">
      <animate attributeName="width" from="0" to="379" begin="2.3s" dur="1.5s" fill="freeze" />
    </rect></clipPath>
  </defs>

  <text class="m" x="24" y="62"><tspan class="user">mael@esaip</tspan><tspan class="pct">:</tspan><tspan class="dir">~</tspan><tspan class="pct">$</tspan></text>
  <g clip-path="url(#k0)"><text class="m cmd" x="138" y="62">./hello.sh</text></g>
  <rect class="cur" x="138" y="50" width="8" height="15">
    <animate attributeName="x" from="138" to="219" begin="0.4s" dur="0.8s" fill="freeze" />
    <animate attributeName="opacity" from="1" to="0" begin="1.25s" dur="0.2s" fill="freeze" />
  </rect>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.7s" fill="freeze" />
    <text class="name" x="24" y="112">MAËL COMPAGNON</text>
    <text class="sub" x="26" y="134">AI &amp; Robotics Engineering Student — ESAIP, Angers, France</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.4s" fill="freeze" />
    <text class="m hl" x="24" y="175">&gt;</text>
  </g>
  <g clip-path="url(#k1)"><text class="m out" x="48" y="175">will relocate anywhere with interesting robots</text></g>
  <rect class="cur" x="48" y="161" width="8" height="16" opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="2.3s" dur="0.01s" fill="freeze" />
    <animate attributeName="x" from="48" to="421" begin="2.3s" dur="1.5s" fill="freeze" />
    <animate attributeName="opacity" begin="3.85s" dur="1.1s" repeatCount="indefinite" values="1;1;0;0" keyTimes="0;0.5;0.5;1" />
  </rect>
</svg>
