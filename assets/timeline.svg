<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 458" width="860" height="458" role="img" aria-label="Career timeline: ESAIP engineering school, Numih 2024, ANT president since 2024, SeAMK Finland and SalMar Norway in 2026, looking for an internship in 2027">
  <style>
