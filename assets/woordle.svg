<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 322" width="860" height="322" role="img" aria-label="Terminal: une partie de Woordle. AVION, aucune lettre du mot. ROUTE, le E final est bien place, R et T sont ailleurs. TERME, trouve en 3 essais. Jeu de lettres en Java, console, sans dependance.">
  <style>
    .m    { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13.5px; }
    .tt   { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11px; fill: #6e7681; }
    .user { fill: #2dd4bf; }
    .dir  { fill: #58a6ff; }
    .pct  { fill: #8b949e; }
    .cmd  { fill: #e6edf3; }
    .out  { fill: #adbac7; }
    .dim  { fill: #768390; }
    .hl   { fill: #2dd4bf; font-weight: 600; }
    .cur  { fill: #2dd4bf; }
    .titre{ font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; font-weight: 700; fill: #e6edf3; letter-spacing: 5px; }
    .note { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 12px; fill: #768390; }
    .cas  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 16px; font-weight: 700; }
  </style>

  <rect x="0.5" y="0.5" width="859" height="321" rx="8" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 8.5a8 8 0 0 1 8-8h843a8 8 0 0 1 8 8V34H0.5z" fill="#161b22" stroke="#30363d"/>
  <circle cx="24" cy="17" r="5.5" fill="#ec6a5e"/>
  <circle cx="44" cy="17" r="5.5" fill="#f4bf4f"/>
  <circle cx="64" cy="17" r="5.5" fill="#61c554"/>
  <text class="tt" x="430" y="21" text-anchor="middle">maelcompagnon — zsh</text>

  <defs>
    <clipPath id="w0"><rect x="202" y="50" width="0" height="20">
      <animate attributeName="width" from="0" to="81" begin="0.4s" dur="0.8s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <!-- Invite et commande, frappée au clavier -->
  <text class="m" x="24" y="64"><tspan class="user">mael@esaip</tspan><tspan class="pct">:</tspan><tspan class="dir">~/Woordle</tspan><tspan class="pct">$</tspan></text>
  <g clip-path="url(#w0)"><text class="m cmd" x="202" y="64">./build.sh</text></g>
  <rect class="cur" x="202" y="52" width="8" height="15">
    <animate attributeName="x" from="202" to="283" begin="0.4s" dur="0.8s" fill="freeze"/>
    <animate attributeName="opacity" from="1" to="0" begin="1.25s" dur="0.2s" fill="freeze"/>
  </rect>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.35s" fill="freeze"/>
    <text class="m dim" x="24" y="86">Compilation... 22 classes, aucune dépendance.</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.9s" dur="0.4s" fill="freeze"/>
    <text class="titre" x="24" y="118">WOORDLE</text>
    <text class="m dim" x="24" y="140">Devinez le mot de 5 lettres en 6 essais.</text>
  </g>

  <!-- Une vraie partie : AVION, ROUTE, puis TERME. -->

  <!-- AVION : aucune lettre commune avec TERME -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.4s" dur="0.4s" fill="freeze"/>
    <rect x="24"  y="160" width="34" height="34" rx="3" fill="#373e47"/>
    <rect x="64"  y="160" width="34" height="34" rx="3" fill="#373e47"/>
    <rect x="104" y="160" width="34" height="34" rx="3" fill="#373e47"/>
    <rect x="144" y="160" width="34" height="34" rx="3" fill="#373e47"/>
    <rect x="184" y="160" width="34" height="34" rx="3" fill="#373e47"/>
    <text class="cas" fill="#768390" y="183" text-anchor="middle">
      <tspan x="41">A</tspan><tspan x="81">V</tspan><tspan x="121">I</tspan><tspan x="161">O</tspan><tspan x="201">N</tspan>
    </text>
    <text class="note" x="244" y="182">aucune de ces lettres n'est dans le mot</text>
  </g>

  <!-- ROUTE : R et T mal placés, E bien placé -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.4s" fill="freeze"/>
    <rect x="24"  y="204" width="34" height="34" rx="3" fill="#f4bf4f"/>
    <rect x="64"  y="204" width="34" height="34" rx="3" fill="#373e47"/>
    <rect x="104" y="204" width="34" height="34" rx="3" fill="#373e47"/>
    <rect x="144" y="204" width="34" height="34" rx="3" fill="#f4bf4f"/>
    <rect x="184" y="204" width="34" height="34" rx="3" fill="#61c554"/>
    <text class="cas" y="227" text-anchor="middle">
      <tspan x="41"  fill="#0d1117">R</tspan><tspan x="81"  fill="#768390">O</tspan><tspan x="121" fill="#768390">U</tspan><tspan x="161" fill="#0d1117">T</tspan><tspan x="201" fill="#0d1117">E</tspan>
    </text>
    <text class="note" x="244" y="226">le E final est bien placé, R et T sont ailleurs</text>
  </g>

  <!-- TERME : trouvé -->
  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.4s" dur="0.4s" fill="freeze"/>
    <rect x="24"  y="248" width="34" height="34" rx="3" fill="#61c554"/>
    <rect x="64"  y="248" width="34" height="34" rx="3" fill="#61c554"/>
    <rect x="104" y="248" width="34" height="34" rx="3" fill="#61c554"/>
    <rect x="144" y="248" width="34" height="34" rx="3" fill="#61c554"/>
    <rect x="184" y="248" width="34" height="34" rx="3" fill="#61c554"/>
    <text class="cas" fill="#0d1117" y="271" text-anchor="middle">
      <tspan x="41">T</tspan><tspan x="81">E</tspan><tspan x="121">R</tspan><tspan x="161">M</tspan><tspan x="201">E</tspan>
    </text>
    <text class="note" x="244" y="270">les deux E, chacun à sa place</text>
  </g>

  <g opacity="0"><animate attributeName="opacity" from="0" to="1" begin="3.9s" dur="0.4s" fill="freeze"/>
    <text class="m hl" x="24" y="304">Bravo ! Trouvé en 3 essais.</text>
    <text class="m dim" x="590" y="304">Java · console · 1 710 mots</text>
  </g>
</svg>
