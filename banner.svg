<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-label="Mael Compagnon — AI and robotics student at ESAIP, looking for a 6-month internship in 2027">
  <style>
    .name   { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 44px; font-weight: 600; letter-spacing: 2.5px; fill: #1f2328; }
    .mono   { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 16px; fill: #1f2328; }
    .muted  { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 13px; fill: #636c76; letter-spacing: 0.3px; }
    .rule   { stroke: #d0d7de; stroke-width: 1; }
    .cursor { fill: #0f766e; }
    @media (prefers-color-scheme: dark) {
      .name   { fill: #e6edf3; }
      .mono   { fill: #e6edf3; }
      .muted  { fill: #8b949e; }
      .rule   { stroke: #30363d; }
      .cursor { fill: #2dd4bf; }
    }
  </style>

  <defs>
    <clipPath id="c0"><rect x="60" y="120" width="0" height="26">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;421;421;0;0"
        keyTimes="0;0.008;0.083;0.292;0.325;1" />
    </rect></clipPath>
    <clipPath id="c1"><rect x="60" y="120" width="0" height="26">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;373;373;0;0"
        keyTimes="0;0.342;0.417;0.625;0.658;1" />
    </rect></clipPath>
    <clipPath id="c2"><rect x="60" y="120" width="0" height="26">
      <animate attributeName="width" dur="12s" repeatCount="indefinite"
        values="0;0;383;383;0;0"
        keyTimes="0;0.675;0.750;0.958;0.992;1" />
    </rect></clipPath>
  </defs>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.9s" fill="freeze" />
    <g transform="translate(0,14)">
      <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.1s" dur="0.9s" fill="freeze" />
      <text class="name" x="60" y="76">MAËL COMPAGNON</text>
    </g>
  </g>

  <line class="rule" x1="60" y1="100" x2="60" y2="100">
    <animate attributeName="x2" from="60" to="840" begin="0.6s" dur="1.1s" fill="freeze" />
  </line>

  <g clip-path="url(#c0)"><text class="mono" x="60" y="139">AI &amp; robotics student at ESAIP, fourth year</text></g>
  <g clip-path="url(#c1)"><text class="mono" x="60" y="139">back from Finland, currently in Norway</text></g>
  <g clip-path="url(#c2)"><text class="mono" x="60" y="139">looking for a 6-month internship — 2027</text></g>

  <rect class="cursor" x="60" y="124" width="9" height="18" opacity="0">
    <animate attributeName="opacity" begin="1.4s" dur="1s" repeatCount="indefinite"
      values="1;1;0;0" keyTimes="0;0.5;0.5;1" />
    <animate attributeName="x" dur="12s" repeatCount="indefinite"
      values="66;66;487;487;66;66;439;439;66;66;449;449;66;66"
      keyTimes="0;0.008;0.083;0.292;0.325;0.342;0.417;0.625;0.658;0.675;0.750;0.958;0.992;1" />
  </rect>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="1.6s" dur="1s" fill="freeze" />
    <text class="muted" x="60" y="172">Angers, France — will relocate anywhere that has interesting robots</text>
  </g>
</svg>
